th=".5"/></pattern></defs><rect width="800" height="360" fill="url(#grid)"/><rect x="30" y="110" width="170" height="130" rx="8" fill="#142d4a" stroke="#82b8ff"/><text x="115" y="165" text-anchor="middle">CPU</text><text x="115" y="198" text-anchor="middle">CONTROL</text><path class="signal-travel" d="M200 175H295 M565 175H650" stroke="#7fcaff" stroke-width="4" stroke-dasharray="10 10"/><rect x="290" y="30" width="280" height="290" rx="10" fill="#101d35" stroke="#8287d2"/><text x="430" y="65" text-anchor="middle">GPU / PARALLEL</text><rect class="compute-cell" style="--delay:0.0s" x="315" y="90" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.2s" x="375" y="90" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.4s" x="435" y="90" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.6000000000000001s" x="495" y="90" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.0s" x="315" y="155" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.2s" x="375" y="155" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.4s" x="435" y="155" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.6000000000000001s" x="495" y="155" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.0s" x="315" y="220" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.2s" x="375" y="220" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.4s" x="435" y="220" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect class="compute-cell" style="--delay:0.6000000000000001s" x="495" y="220" width="45" height="45" rx="4" fill="#415a9c" stroke="#a6b8ff"/><rect x="650" y="110" width="125" height="130" rx="8" fill="#133434" stroke="#7ce3cf"/><text x="713" y="168" text-anchor="middle">I / Q</text><text x="713" y="198" text-anchor="middle">OUTPUT</text></svg><div class="animation-toolbar"><span class="micro">ANIMATED EXPLAINER / 03</span><div><button class="animation-prev" aria-label="Previous animation step">←</button><button class="animation-toggle"></button><button class="animation-next" aria-label="Next animation step">→</button></div></div><ol class="animation-steps"><li data-zh="CPU 安排流程與準備資料" data-en="The CPU coordinates and prepares data"></li><li data-zh="資料傳送至 GPU" data-en="Data moves to the GPU"></li><li data-zh="多個運算單元平行處理" data-en="Many processing units operate in parallel"></li><li data-zh="彙整樣本並輸出訊號" data-en="Samples are combined into signal output"></li></ol><figcaption class="note" data-zh="教學示意：距離、速度、波形與運算規模不按真實比例。" data-en="Educational illustration: distances, speeds, waveforms and processing scale are not to scale."></figcaption></figure><div class="learning"><article class="learning-topic" id="learn-compute"><div class="topic-index">03 / COMPUTING</div><div class="topic-body"><h3 class="" data-zh="為什麼需要 CPU 與 GPU 合作？" data-en="Why combine CPUs and GPUs?"></h3><p class="topic-intro" data-zh="就像一組人安排工作流程，另一組人同時完成大量重複計算。CPU 適合處理控制與流程，GPU 可平行處理許多相似運算；搭配得宜，才能讓模擬跟上訊號變化。" data-en="One team coordinates the workflow while another performs many repetitive calculations at once. CPUs handle control and sequencing; GPUs can execute many similar operations in parallel. Effective coordination helps simulation keep pace with changing signals."></p><p class="concept-line" data-zh="平行處理增加同時工作的能力，不代表任何程式都會自動變快。" data-en="Parallelism increases concurrent work; it does not automatically accelerate every program."></p><details><summary class="" data-zh="深入理解｜取樣、資料搬移與即時性" data-en="Go deeper | Sampling, transfers and real-time constraints"></summary><div class="technical-note"><code>fₛ &gt; 2B  ·  理想低通取樣條件 / ideal low-pass sampling condition</code><p class="" data-zh="對頻寬限制在 B Hz 的理想實數低通信號，取樣頻率需高於 2B 才能避免混疊；複數基帶與帶通取樣需依訊號定義另行分析。實作效能還受記憶體頻寬、CPU/GPU 資料傳輸與排程延遲影響。評估即時系統時，除了平均速度，也要檢查是否能在每次截止時間前完成工作。" data-en="For an ideal real low-pass signal limited to B Hz, sampling above 2B avoids aliasing; complex baseband and bandpass sampling require separate analysis. Performance also depends on memory bandwidth, CPU/GPU transfers and scheduling latency. Real-time evaluation considers deadlines, not just average throughput."></p></div></details></div></article></div><div class="page-next"><a href="validation.html" data-zh="下一主題：實驗與驗證 ↗" data-en="Next: Experiments & validation ↗"></a></div></section><div class="lesson-references"><details><summary data-zh="延伸閱讀與內容依據" data-en="Further reading and sources"></summary><p><a href="https://www.gps.gov/gps" target="_blank" rel="noopener">GPS.gov — GPS fundamentals ↗</a><br><a href="https://gssc.esa.int/navipedia/GNSS_Book/ESA_GNSS-Book_TM-23_Vol_I.pdf" target="_blank" rel="noopener">ESA — GNSS Data Processing, Volume I ↗</a></p><p data-zh="實作脈絡參考團隊 BDS-SDRSIM 文件與 2026 年專題成果報告；動畫為原理示意，非實測結果。" data-en="Implementation context draws on the team’s BDS-SDRSIM document and 2026 report. Animations illustrate principles rather than measured results."></p></details></div></main><footer><a class="brand" href="index.html">✳ F459<span>LAB</span></a><span>RESEARCH BEYOND BOUNDARIES.</span><a href="learn.html" data-zh="探索通訊知識 ↗" data-en="Explore communications ↗"></a></footer><script src="app.js?v=multi1"></script><script src="pages.js?v=1"></script><script src="learning.js?v=2"></script></body></html>
