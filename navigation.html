<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GPS 與北斗雙星系即時訊號合成與無人機飛行管制研究，APICTA 專案展示。"><title>導航與定位 — F459 LAB</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="refinements.css"><link rel="stylesheet" href="identity.css?v=20261028-names"><link rel="stylesheet" href="bds.css?v=20261028-science"><link rel="stylesheet" href="learning.css?v=1"><link rel="stylesheet" href="pages.css?v=gnss1"></head><body><a class="skip" href="#main">跳至內容 / Skip to content</a><header><a class="brand" href="index.html">✳ F459<span>LAB</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" data-zh="選單 ☰" data-en="Menu ☰"></button><nav id="site-nav" aria-label="Main navigation"><a href="index.html" data-zh="首頁" data-en="Home"></a><a href="gnss.html" data-zh="全球 GNSS" data-en="Global GNSS"></a><a href="learn.html" aria-current="page" data-zh="通訊科普" data-en="Learn"></a><a href="technology.html" data-zh="核心技術" data-en="Technology"></a><a href="results.html" data-zh="研究成果" data-en="Results"></a><a href="team.html" data-zh="研究團隊" data-en="Team"></a></nav><button class="lang" id="language">EN ↗</button></header><main id="main"><div class="breadcrumb"><a href="index.html" data-zh="首頁" data-en="Home"></a><span>/</span><span class="" data-zh="通訊科普 / 導航與定位" data-en="Learn / Navigation &amp; positioning"></span></div><section class="section lesson-page"><a class="back-link" href="learn.html" data-zh="← 所有科普主題" data-en="← All learning topics"></a><span class="micro">MODULE 01</span><h1 class="" data-zh="導航與定位" data-en="Navigation &amp; positioning"></h1><figure class="animation-panel" data-kind="navigation" data-step="0"><svg class="explain-svg" viewBox="0 0 800 360" role="img" aria-label="navigation conceptual animation"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284465" stroke-width=".5"/></pattern></defs><rect width="800" height="360" fill="url(#grid)"/><ellipse cx="400" cy="340" rx="310" ry="55" fill="#122e4d" stroke="#477ead"/><path d="M150 110 Q400 -50 650 110" fill="none" stroke="#415c7b" stroke-dasharray="5 9"/><g class="stage-item" data-stage="0"><path class="signal-travel" d="M130 100 L400 290" stroke="#74beff" stroke-width="2" stroke-dasharray="8 16"/><g transform="translate(130,85)"><rect x="-14" y="-10" width="28" height="20" fill="#bedbff"/><path d="M-48 -16h28v32h-28z M20 -16h28v32H20z" fill="#2553a0" stroke="#8eb9ee"/></g><text x="130" y="127" text-anchor="middle">SAT 1</text></g><g class="stage-item" data-stage="1"><path class="signal-travel" d="M300 60 L400 290" stroke="#74beff" stroke-width="2" stroke-dasharray="8 16"/><g transform="translate(300,45)"><rect x="-14" y="-10" width="28" height="20" fill="#bedbff"/><path d="M-48 -16h28v32h-28z M20 -16h28v32H20z" fill="#2553a0" stroke="#8eb9ee"/></g><text x="300" y="87" text-anchor="middle">SAT 2</text></g><g class="stage-item" data-stage="2"><path class="signal-travel" d="M510 70 L400 290" stroke="#74beff" stroke-width="2" stroke-dasharray="8 16"/><g transform="translate(510,55)"><rect x="-14" y="-10" width="28" height="20" fill="#bedbff"/><path d="M-48 -16h28v32h-28z M20 -16h28v32H20z" fill="#2553a0" stroke="#8eb9ee"/></g><text x="510" y="97" text-anchor="middle">SAT 3</text></g><g class="stage-item" data-stage="3"><path class="signal-travel" d="M675 115 L400 290" stroke="#74beff" stroke-width="2" stroke-dasharray="8 16"/><g transform="translate(675,100)"><rect x="-14" y="-10" width="28" height="20" fill="#bedbff"/><path d="M-48 -16h28v32h-28z M20 -16h28v32H20z" fill="#2553a0" stroke="#8eb9ee"/></g><text x="675" y="142" text-anchor="middle">SAT 4</text></g><circle class="receiver-pulse" cx="400" cy="290" r="24" fill="none" stroke="#81dfdc"/><rect x="385" y="265" width="30" height="48" rx="6" fill="#123641" stroke="#8af1e9"/><text x="455" y="300">RECEIVER</text></svg><div class="animation-toolbar"><span class="micro">ANIMATED EXPLAINER / 01</span><div><button class="animation-prev" aria-label="Previous animation step">←</button><button class="animation-toggle"></button><button class="animation-next" aria-label="Next animation step">→</button></div></div><ol class="animation-steps"><li data-zh="衛星廣播位置與時間" data-en="Satellites broadcast position and time"></li><li data-zh="接收機比對訊號抵達時間" data-en="The receiver compares arrival timing"></li><li data-zh="多顆衛星提供距離條件" data-en="Several satellites provide range constraints"></li><li data-zh="同時解出位置與時鐘偏差" data-en="Solve position and receiver clock offset"></li></ol><figcaption class="note" data-zh="教學示意：距離、速度、波形與運算規模不按真實比例。" data-en="Educational illustration: distances, speeds, waveforms and processing scale are not to scale."></figcaption></figure><div class="learning"><article class="learning-topic" id="learn-position"><div class="topic-index">01 / NAVIGATION</div><div class="topic-body"><h3 class="" data-zh="手機怎麼知道你在哪裡？" data-en="How does your phone locate you?"></h3><p class="topic-intro" data-zh="衛星像是在天空中不斷廣播「我在哪裡、現在幾點」。手機接收訊號，利用傳播時間估算距離，再結合多顆衛星的位置，求出自己的位置。" data-en="Satellites continuously broadcast where they are and what time it is. Your phone estimates distances from signal travel times and combines several satellites to solve its own position."></p><p class="concept-line" data-zh="星曆 ≈ 衛星的軌道時刻表；定位 ≈ 同時解出多個距離條件。" data-en="Ephemerides are like orbital timetables; positioning solves several distance constraints together."></p><details><summary class="" data-zh="深入理解｜偽距、鐘差與四個未知數" data-en="Go deeper | Pseudorange, clock offsets and four unknowns"></summary><div class="technical-note"><code>ρ = r + c(δtᵣ − δtₛ) + I + T + ε</code><p class="" data-zh="ρ 是量測的偽距，r 是幾何距離，c 是光速；δtᵣ、δtₛ 是接收機與衛星鐘差，I、T 分別代表電離層與對流層延遲，ε 包含其他誤差。在一般單一時間系統的三維定位中，需要解出 x、y、z 與接收機鐘差，因此通常至少需要四顆衛星。這是簡化模型；實際解算還需處理更多修正項。" data-en="Here ρ is measured pseudorange, r is geometric range, c is the speed of light, δtᵣ and δtₛ are clock offsets, I and T are atmospheric delays, and ε represents other errors. A conventional 3D solution in one time system solves x, y, z and receiver clock offset, normally requiring at least four satellites. Practical solutions include further corrections."></p></div></details></div></article></div><div class="timing-lab"><div><span class="micro">TRY IT / 訊號小實驗</span><h3 class="" data-zh="一點點時間差，代表多遠？" data-en="How far does a tiny time offset reach?"></h3><p class="" data-zh="拖曳時間差，觀察它對應的訊號傳播距離。" data-en="Move the slider to explore the corresponding signal propagation distance."></p></div><div class="lab-controls"><label for="timing-offset" data-zh="時間差（微秒 μs）" data-en="Time offset (microseconds, μs)"></label><input id="timing-offset" type="range" min="0" max="10" step="0.1" value="1"><div class="lab-readout"><output id="timing-value" for="timing-offset">1.0 μs</output><span>→</span><output id="timing-distance" for="timing-offset">299.8 m</output></div><p class="note" data-zh="以真空光速計算的單程距離示意，並非實際定位誤差預測。" data-en="One-way distance at the speed of light in vacuum, not a prediction of positioning error."></p></div></div><div class="page-next"><a href="signals.html" data-zh="下一主題：訊號與通訊 ↗" data-en="Next: Signals & communication ↗"></a></div></section><div class="lesson-references"><details><summary data-zh="延伸閱讀與內容依據" data-en="Further reading and sources"></summary><p><a href="https://www.gps.gov/gps" target="_blank" rel="noopener">GPS.gov — GPS fundamentals ↗</a><br><a href="https://gssc.esa.int/navipedia/GNSS_Book/ESA_GNSS-Book_TM-23_Vol_I.pdf" target="_blank" rel="noopener">ESA — GNSS Data Processing, Volume I ↗</a></p><p data-zh="實作脈絡參考團隊 BDS-SDRSIM 文件與 2026 年專題成果報告；動畫為原理示意，非實測結果。" data-en="Implementation context draws on the team’s BDS-SDRSIM document and 2026 report. Animations illustrate principles rather than measured results."></p></details></div></main><footer><a class="brand" href="index.html">✳ F459<span>LAB</span></a><span>RESEARCH BEYOND BOUNDARIES.</span><a href="learn.html" data-zh="探索通訊知識 ↗" data-en="Explore communications ↗"></a></footer><script src="app.js?v=multi1"></script><script src="pages.js?v=1"></script><script src="learning.js?v=2"></script></body></html>
