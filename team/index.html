<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GPS 與北斗雙星系即時訊號合成與無人機飛行管制研究，APICTA 專案展示。"><title>研究團隊 — F459 LAB</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../refinements.css"><link rel="stylesheet" href="../identity.css?v=20261028-names"><link rel="stylesheet" href="../bds.css?v=20261028-science"><link rel="stylesheet" href="../learning.css?v=1"><link rel="stylesheet" href="../pages.css?v=gnss1"></head><body><a class="skip" href="#main">跳至內容 / Skip to content</a><header><a class="brand" href="../">✳ F459<span>LAB</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" data-zh="選單 ☰" data-en="Menu ☰"></button><nav id="site-nav" aria-label="Main navigation"><a href="../" data-zh="首頁" data-en="Home"></a><a href="../gnss/" data-zh="全球 GNSS" data-en="Global GNSS"></a><a href="../learn/" data-zh="通訊科普" data-en="Learn"></a><a href="../technology/" data-zh="核心技術" data-en="Technology"></a><a href="../results/" data-zh="研究成果" data-en="Results"></a><a href="../team/" aria-current="page" data-zh="研究團隊" data-en="Team"></a></nav><button class="lang" id="language">EN ↗</button></header><main id="main"><div class="breadcrumb"><a href="../" data-zh="首頁" data-en="Home"></a><span>/</span><span class="" data-zh="研究團隊" data-en="Team"></span></div><section id="team" class="section team"><div class="section-label">05 / THE PEOPLE BEHIND THE SIGNAL</div><div class="heading-row"><h2 data-zh="以研究為核心，<br>讓探索持續傳承。" data-en="Led by research.<br>Built across generations."></h2><div class="affiliations"><a class="affiliation university" href="https://www.nkust.edu.tw/" target="_blank" rel="noopener"><div class="institution-mark"><img src="../nkust-logo.png" alt="國立高雄科技大學 NKUST 校徽及標準字" width="6379" height="1182"></div><div><strong>國立高雄科技大學</strong><span lang="en">National Kaohsiung University of Science and Technology</span></div></a><a class="affiliation department" href="https://ccee.nkust.edu.tw/" target="_blank" rel="noopener"><div class="institution-mark"><img src="../cce-logo.jpg" alt="電腦與通訊工程系 CCE 系徽" width="1149" height="704"></div><div><strong>電腦與通訊工程系</strong><span lang="en">Department of Computer and Communication Engineering</span></div></a></div></div><div class="team-map"><article class="advisor-node"><div class="portrait"><img src="../professor-wu.png" alt="吳介騫教授" width="98" height="113"></div><span class="team-role" data-zh="指導教授" data-en="FACULTY ADVISOR"></span><h3><span data-zh="吳介騫" data-en="JC Wu"></span><span class="member-alias" data-zh="JC Wu" data-en="吳介騫"></span><small class="" data-zh="教授" data-en="Professor"></small></h3><p class="advisor-background" data-zh="國立高雄科技大學&lt;br&gt;電腦與通訊工程系" data-en="National Kaohsiung University of Science and Technology&lt;br&gt;Department of Computer and Communication Engineering"></p><h4 class="" data-zh="本專案研究方向" data-en="Project research focus"></h4><p class="advisor-summary" data-zh="以衛星導航訊號合成、軟體定義無線電及無人機飛行管制為本專案研究主軸，指導團隊整合導航模擬、通訊系統實作與實驗驗證。" data-en="Provides research guidance in satellite navigation signal synthesis, software-defined radio, and UAV flight management, integrating navigation simulation, communications system implementation, and experimental validation."></p></article><ol class="map-branches"><li class="map-branch"><div class="branch-label"><h3>113</h3><span class="" data-zh="導航基礎" data-en="Navigation foundations"></span></div><ul class="map-members"><li class="researcher"><div class="portrait" role="img" aria-label="賴震東 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="賴震東" data-en="Z.D"></span><span class="member-alias" data-zh="Z.D" data-en="賴震東"></span></h4><p class="" data-zh="投入 GPS 導航訊號與星曆延伸之研究，著重衛星軌道資訊的延伸應用。" data-en="Investigates GPS navigation signals and ephemeris extension, with an emphasis on extended applications of satellite orbital information."></p></div></li></ul></li><li class="map-branch"><div class="branch-label"><h3>114</h3><span class="" data-zh="雙模與運算" data-en="Dual mode &amp; computing"></span></div><ul class="map-members"><li class="researcher"><div class="portrait" role="img" aria-label="劉予翰 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="劉予翰" data-en="Liuuu"></span><span class="member-alias" data-zh="Liuuu" data-en="劉予翰"></span></h4><p class="" data-zh="聚焦北斗導航訊號系統開發與 GPS / BDS 雙模整合，進行 GPU 平行加速實作及 Yagi–Uda 天線製作，涵蓋訊號運算與射頻硬體實作。" data-en="Focuses on BeiDou navigation signal system development and GPS / BDS dual-mode integration, implementing GPU parallel acceleration and constructing Yagi–Uda antennas across signal processing and RF hardware."></p></div></li></ul></li><li class="map-branch"><div class="branch-label"><h3>115</h3><span class="" data-zh="平台整合與驗證" data-en="Platform integration &amp; validation"></span></div><ul class="map-members"><li class="researcher"><div class="portrait" role="img" aria-label="林翔晨 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="林翔晨" data-en="En"></span><span class="member-alias" data-zh="En" data-en="林翔晨"></span></h4><p class="" data-zh="負責整體圖形化操作介面與源頭星曆處理流水線之建置，並提出導入 GPU 運算之構想，推進平台操作與資料處理流程整合。" data-en="Develops the integrated graphical user interface and source ephemeris processing pipeline, and proposed the adoption of GPU computing to advance platform operation and data workflow integration."></p></div></li><li class="researcher"><div class="portrait" role="img" aria-label="吳佳寰 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="吳佳寰" data-en="Jamie"></span><span class="member-alias" data-zh="Jamie" data-en="吳佳寰"></span></h4><p class="" data-zh="執行無人機與行動終端之實驗驗證，觀察系統在測試情境下的回應，並提出無人機相關安全弱點之研究觀察。" data-en="Conducts experimental validation using UAVs and mobile devices, examines system responses under test conditions, and contributes research observations on UAV-related security weaknesses."></p></div></li><li class="researcher"><div class="portrait" role="img" aria-label="李佳爵 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="李佳爵" data-en="Genelee"></span><span class="member-alias" data-zh="Genelee" data-en="李佳爵"></span></h4><p class="" data-zh="著重通訊相關軟體之編譯流程優化，支援系統建置與通訊模組整合。" data-en="Focuses on optimizing compilation workflows for communications software, supporting system builds and communications module integration."></p></div></li><li class="researcher"><div class="portrait" role="img" aria-label="何若鏡 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="何若鏡" data-en="Mirror"></span><span class="member-alias" data-zh="Mirror" data-en="何若鏡"></span></h4><p class="" data-zh="支援無人機實驗載具與測試資源，協助研究團隊開展實體載具驗證。" data-en="Supports experimental UAV platforms and test resources, enabling the team’s validation activities with physical aircraft."></p></div></li><li class="researcher"><div class="portrait" role="img" aria-label="錢思妤 個人照片預留區"><svg viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="44" r="22"/><path d="M20 125v-15a40 40 0 0 1 80 0v15"/></svg></div><div><h4><span data-zh="錢思妤" data-en="Money"></span><span class="member-alias" data-zh="Money" data-en="錢思妤"></span></h4><p class="" data-zh="承接無人機相關偵測之後續優化工作，聚焦偵測功能的改進與研究延伸。" data-en="Undertakes subsequent optimization of UAV-related detection, focusing on functional improvements and further research development."></p></div></li></ul></li></ol></div></section></main><footer><a class="brand" href="../">✳ F459<span>LAB</span></a><span>RESEARCH BEYOND BOUNDARIES.</span><a href="../learn/" data-zh="探索通訊知識 ↗" data-en="Explore communications ↗"></a></footer><script src="../app.js?v=multi1"></script><script src="../pages.js?v=clean1"></script><script src="../learning.js?v=2"></script></body></html>
