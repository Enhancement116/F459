<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GPS 與北斗雙星系即時訊號合成與無人機飛行管制研究，APICTA 專案展示。"><title>實驗與驗證 — F459 LAB</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="refinements.css"><link rel="stylesheet" href="identity.css?v=20261028-names"><link rel="stylesheet" href="bds.css?v=20261028-science"><link rel="stylesheet" href="learning.css?v=1"><link rel="stylesheet" href="pages.css?v=gnss1"></head><body><a class="skip" href="#main">跳至內容 / Skip to content</a><header><a class="brand" href="index.html">✳ F459<span>LAB</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" data-zh="選單 ☰" data-en="Menu ☰"></button><nav id="site-nav" aria-label="Main navigation"><a href="index.html" data-zh="首頁" data-en="Home"></a><a href="gnss.html" data-zh="全球 GNSS" data-en="Global GNSS"></a><a href="learn.html" aria-current="page" data-zh="通訊科普" data-en="Learn"></a><a href="technology.html" data-zh="核心技術" data-en="Technology"></a><a href="results.html" data-zh="研究成果" data-en="Results"></a><a href="team.html" data-zh="研究團隊" data-en="Team"></a></nav><button class="lang" id="language">EN ↗</button></header><main id="main"><div class="breadcrumb"><a href="index.html" data-zh="首頁" data-en="Home"></a><span>/</span><span class="" data-zh="通訊科普 / 實驗與驗證" data-en="Learn / Experiments &amp; validation"></span></div><section class="section lesson-page"><a class="back-link" href="learn.html" data-zh="← 所有科普主題" data-en="← All learning topics"></a><span class="micro">MODULE 04</span><h1 class="" data-zh="實驗與驗證" data-en="Experiments &amp; validation"></h1><figure class="animation-panel" data-kind="validation" data-step="0"><svg class="explain-svg" viewBox="0 0 800 360" role="img" aria-label="validation conceptual animation"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284465" stroke-width=".5"/></pattern></defs><rect width="800" height="360" fill="url(#grid)"/><path class="signal-travel" d="M170 175h45" stroke="#76adf7" stroke-width="3" stroke-dasharray="5 7"/><g class="stage-item" data-stage="0"><rect x="25" y="90" width="145" height="170" rx="10" fill="#142d4c" stroke="#8cbfff"/><circle cx="97" cy="140" r="23" fill="#244779" stroke="#8cbfff"/><text x="97" y="148" text-anchor="middle">01</text><text x="97" y="210" text-anchor="middle">ACQUIRE</text></g><path class="signal-travel" d="M368 175h45" stroke="#76adf7" stroke-width="3" stroke-dasharray="5 7"/><g class="stage-item" data-stage="1"><rect x="223" y="90" width="145" height="170" rx="10" fill="#142d4c" stroke="#8cbfff"/><circle cx="295" cy="140" r="23" fill="#244779" stroke="#8cbfff"/><text x="295" y="148" text-anchor="middle">02</text><text x="295" y="210" text-anchor="middle">TRACK</text></g><path class="signal-travel" d="M566 175h45" stroke="#76adf7" stroke-width="3" stroke-dasharray="5 7"/><g class="stage-item" data-stage="2"><rect x="421" y="90" width="145" height="170" rx="10" fill="#142d4c" stroke="#8cbfff"/><circle cx="493" cy="140" r="23" fill="#244779" stroke="#8cbfff"/><text x="493" y="148" text-anchor="middle">03</text><text x="493" y="210" text-anchor="middle">DECODE</text></g><g class="stage-item" data-stage="3"><rect x="619" y="90" width="145" height="170" rx="10" fill="#142d4c" stroke="#8cbfff"/><circle cx="691" cy="140" r="23" fill="#244779" stroke="#8cbfff"/><text x="691" y="148" text-anchor="middle">04</text><text x="691" y="210" text-anchor="middle">PVT</text></g><text x="400" y="315" text-anchor="middle">SIGNAL → OBSERVATION → SOLUTION</text></svg><div class="animation-toolbar"><span class="micro">ANIMATED EXPLAINER / 04</span><div><button class="animation-prev" aria-label="Previous animation step">←</button><button class="animation-toggle"></button><button class="animation-next" aria-label="Next animation step">→</button></div></div><ol class="animation-steps"><li data-zh="捕獲：尋找訊號與粗略時間" data-en="Acquire: find signals and coarse timing"></li><li data-zh="追蹤：持續對準碼與載波" data-en="Track: maintain code and carrier alignment"></li><li data-zh="解碼：讀取導航資料" data-en="Decode: recover navigation data"></li><li data-zh="PVT：估計位置、速度與時間" data-en="PVT: estimate position, velocity and time"></li></ol><figcaption class="note" data-zh="教學示意：距離、速度、波形與運算規模不按真實比例。" data-en="Educational illustration: distances, speeds, waveforms and processing scale are not to scale."></figcaption></figure><div class="learning"><article class="learning-topic" id="learn-validate"><div class="topic-index">04 / VALIDATION</div><div class="topic-body"><h3 class="" data-zh="產生訊號，就代表研究成功了嗎？" data-en="Does generating a signal prove it works?"></h3><p class="topic-intro" data-zh="像是寫好一段文字，還需要確認別人能讀懂。研究者會檢查接收機能否找到訊號、持續追蹤、讀出導航資料，最後算出位置與時間。每一關都回答不同問題。" data-en="Writing a message is only the first step; someone must be able to read it. Researchers check signal acquisition, stable tracking, navigation decoding and finally position and time estimation. Each stage answers a different question."></p><p class="concept-line" data-zh="找到訊號 → 穩定追蹤 → 讀懂資料 → 解算位置。" data-en="Acquire → track → decode → solve."></p><details><summary class="" data-zh="深入理解｜從功能驗證到量化評估" data-en="Go deeper | From functional checks to quantitative evaluation"></summary><div class="technical-note"><code>Acquisition → Tracking → NAV → PVT</code><p class="" data-zh="PVT 指位置、速度與時間。能產生定位結果是功能性證據，並不等於已證明所有環境下的精度與可靠度。更完整的評估應記錄首次定位時間、定位誤差、追蹤連續性、測試條件與重複次數；不同接收機的結果也應分別比較。" data-en="PVT means position, velocity and time. Obtaining a fix demonstrates functionality, not accuracy and reliability under all conditions. Broader evaluation records time to first fix, positioning errors, tracking continuity, test conditions and repetitions, with separate comparisons across receivers."></p></div></details></div></article></div><div class="page-next"><a href="navigation.html" data-zh="下一主題：導航與定位 ↗" data-en="Next: Navigation & positioning ↗"></a></div></section><div class="lesson-references"><details><summary data-zh="延伸閱讀與內容依據" data-en="Further reading and sources"></summary><p><a href="https://www.gps.gov/gps" target="_blank" rel="noopener">GPS.gov — GPS fundamentals ↗</a><br><a href="https://gssc.esa.int/navipedia/GNSS_Book/ESA_GNSS-Book_TM-23_Vol_I.pdf" target="_blank" rel="noopener">ESA — GNSS Data Processing, Volume I ↗</a></p><p data-zh="實作脈絡參考團隊 BDS-SDRSIM 文件與 2026 年專題成果報告；動畫為原理示意，非實測結果。" data-en="Implementation context draws on the team’s BDS-SDRSIM document and 2026 report. Animations illustrate principles rather than measured results."></p></details></div></main><footer><a class="brand" href="index.html">✳ F459<span>LAB</span></a><span>RESEARCH BEYOND BOUNDARIES.</span><a href="learn.html" data-zh="探索通訊知識 ↗" data-en="Explore communications ↗"></a></footer><script src="app.js?v=multi1"></script><script src="pages.js?v=1"></script><script src="learning.js?v=2"></script></body></html>
